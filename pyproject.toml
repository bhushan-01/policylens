[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens"
version = "0.2.0"
description = "EU AI Act lookup, risk classification, buyer-questionnaire evidence packs, and code scanning, with verified citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.0.0",
  "sentence-transformers>=6.0.0",
  "numpy>=1.24.0",
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "mcp>=1.0.0",
  "gradio>=5.0.0",
]

[project.scripts]
policylens = "policylens.checklist:main"
policylens-pack = "policylens.pack:main"
policylens-scan = "policylens.scanner:main"
policylens-ui = "policylens.ui:main"
policylens-mcp = "policylens.mcp_server:main"

[tool.setuptools.packages.find]
include = ["policylens*"]
